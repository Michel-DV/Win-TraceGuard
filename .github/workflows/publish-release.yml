name: Publish portfolio release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish v1.0.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ae4fa897e4bba8a3d7ce9e87d412c9ff093a4688
        run: |
          tag="v1.0.1"
          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            git tag "$tag" "$TARGET_SHA"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "Win-TraceGuard v1.0.1" --notes "Pure C11/WinAPI Windows ETW telemetry and behavioral detection sensor with TDH decoding, PID/PPID correlation, explainable detections, JSONL capture/replay, tests and Windows CI."
          fi
